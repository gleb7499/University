# Слаг для именования
# Используем явное дублирование вместо anchors для совместимости
# slug: ас-63-220018-v14

volumes:
  data_v14:
    name: data_v14

networks:
  as63-net:
    name: as63-220018-v14-net
    driver: bridge

services:
  db:
    image: postgres:16-alpine
    container_name: as63-220018-v14-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_220018_v14
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app_user"]
      interval: 20s
      timeout: 5s
      retries: 5
    volumes:
      - data_v14:/var/lib/postgresql/data
    networks:
      - as63-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: as63-220018-v14-app
    restart: unless-stopped
    environment:
      STU_ID: "220018"
      STU_GROUP: "АС-63"
      STU_VARIANT: "14"
      APP_PORT: "8062"
      APP_HOST: "0.0.0.0"
      DATABASE_URL: postgresql://app_user:app_pass@db:5432/app_220018_v14
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8062:8062"
    networks:
      - as63-net
    labels:
      org.bstu.owner: "gleb7499"
      org.bstu.student.slug: "ас-63-220018-v14"
